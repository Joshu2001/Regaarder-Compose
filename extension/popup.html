<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Meneur Command Deck</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      width: 320px;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", sans-serif;
      background: #18181b;
      color: #f4f4f5;
      padding: 16px;
      user-select: none;
    }
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-bottom: 12px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      margin-bottom: 12px;
    }
    .brand {
      font-size: 13px;
      font-weight: 700;
      letter-spacing: -0.2px;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .badge {
      font-size: 9px;
      background: rgba(139, 92, 246, 0.2);
      color: #c4b5fd;
      padding: 2px 6px;
      border-radius: 4px;
      border: 1px solid rgba(139, 92, 246, 0.4);
    }
    .section {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 8px;
      padding: 12px;
      margin-bottom: 10px;
    }
    .section-title {
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      color: #a1a1aa;
      margin-bottom: 6px;
      letter-spacing: 0.5px;
    }
    .btn {
      width: 100%;
      padding: 8px 12px;
      border-radius: 6px;
      font-size: 11px;
      font-weight: 600;
      border: 1px solid rgba(255, 255, 255, 0.12);
      background: #27272a;
      color: #fafafa;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      margin-top: 6px;
      transition: background 0.15s;
    }
    .btn:hover { background: #3f3f46; }
    .btn-primary { background: #7c3aed; border-color: #7c3aed; }
    .btn-primary:hover { background: #6d28d9; }
    .status-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 11px;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="brand">
      <span>Meneur Deck</span>
      <span class="badge">PRO</span>
    </div>
    <span style="font-size: 10px; color: #a1a1aa;">v1.0.0</span>
  </div>

  <div class="section">
    <div class="section-title">Contextual Focus</div>
    <div class="status-row">
      <span style="font-weight: 600;">Deep-Work Shield</span>
      <span id="focusStatus" style="color: #34d399; font-weight: bold;">ACTIVE</span>
    </div>
    <button class="btn" id="toggleFocusBtn">Toggle Shield</button>
  </div>

  <div class="section">
    <div class="section-title">Instant Directive</div>
    <p style="font-size: 11px; color: #d4d4d8; margin-bottom: 6px;">Highlight text and press <strong>Cmd+Shift+D</strong> to queue a directive into Tasks.</p>
    <button class="btn btn-primary" id="captureBtn">Capture Active Tab</button>
  </div>

  <div class="section">
    <div class="section-title">Tab & Session Archiving</div>
    <button class="btn" id="archiveBtn">Archive Working Tabs</button>
  </div>

  <script src="popup.js"></script>
</body>
</html>
